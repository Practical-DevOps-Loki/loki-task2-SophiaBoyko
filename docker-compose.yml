services:
  webapp:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - webapp_logs:/var/log/webapp
    networks:
      - loki
    depends_on:
      - loki

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - loki

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml
      - webapp_logs:/var/log/webapp
    command: -config.file=/etc/promtail/config.yml
    networks:
      - loki
    depends_on:
      - loki
      - webapp
    loki:
      condition: service_healthy
    webapp:
      condition: service_started

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "9090:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./config/grafana-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml
      - grafana_data:/var/lib/grafana
    networks:
      - loki
    depends_on:
      - loki

  log-generator:
    image: alpine:3.18
    networks:
      - loki
    depends_on:
      - webapp
      - promtail
    command: >
      sh -c "sleep 10 &&
             wget -q http://webapp:8080/ -O /dev/null &&
             wget -q http://webapp:8080/ -O /dev/null &&
             wget -q http://webapp:8080/ -O /dev/null &&
             sleep 20"

networks:
  loki:

volumes:
  webapp_logs:
  loki_data:
  grafana_data: