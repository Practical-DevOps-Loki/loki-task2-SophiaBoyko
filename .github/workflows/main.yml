name: Loki Task

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Generate a token
      id: generate-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
    - uses: actions/checkout@v6
    - name: Build and start containers for a services
      run: docker compose up -d
    - name: Wait for logs to appear in Loki
      run: |
        echo "Waiting for the log pipeline to be ready..."
        for i in $(seq 1 24); do
          response=$(curl -s "http://localhost:3100/loki/api/v1/query?query=%7Bwebapp%3D%22varlogs%22%7D" 2>/dev/null || true)
          if echo "$response" | grep -q '"values"'; then
            echo "Logs found in Loki!"
            exit 0
          fi
          echo "Attempt $i/24: Waiting for logs to be ingested... (sleeping 5s)"
          sleep 5
        done
        echo "Warning: Timed out waiting for logs after 120s"
    - name: Test containers functionality
      uses: cypress-io/github-action@v6
      env:
        CYPRESS_BASE_URL: http://localhost:8080
        CYPRESS_GRAFANA_URL: http://localhost:9090
        LANGUAGE: en-US
      with:
        working-directory: ./.github/tests
    - name: Final Step
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      run: |
        gh repo edit $GITHUB_REPOSITORY --visibility private --accept-visibility-change-consequences
